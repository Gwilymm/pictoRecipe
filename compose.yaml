services:
  ###> Application Symfony sous FrankenPHP ###
  pictorecette-app:
    build:
      context: .
      dockerfile: Dockerfile
      # Pas de target = utilise le dernier stage (production)
    container_name: pictorecette-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80" # HTTP
      - "127.0.0.1:8443:443" # HTTPS
      - "127.0.0.1:8443:443/udp" # HTTP/3
    depends_on:
      database:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Uploads persistants
      - pictorecette-uploads:/app/public/uploads
      # Volumes Caddy pour les certificats et la configuration
      - caddy_data:/data
      - caddy_config:/config
      # Caddyfile personnalisé (optionnel, décommenter si besoin)
      # - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-ChangeMe}
      SERVER_NAME: ${SERVER_NAME:-:80}
      # BDD PostgreSQL
      DATABASE_URL: "postgresql://${POSTGRES_USER:-picto}:${POSTGRES_PASSWORD:-motdepassefort}@database:5432/${POSTGRES_DB:-picto}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      # Configuration Caddy (optionnel)
      # CADDY_GLOBAL_OPTIONS: "debug"  # Pour activer les logs de debug
    networks:
      - pictorecette-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Logs lisibles en dev (commenter en production)
    tty: true
  ###< Application Symfony ###

  ###> Base de données PostgreSQL ###
  database:
    container_name: pictoRecipeDatabase
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motdepassefort}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "${POSTGRES_DB:-picto}",
          "-U",
          "${POSTGRES_USER:-app}",
        ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - pictorecette-network
  ###< Base de données PostgreSQL ###

volumes:
  pictorecette-uploads:
    driver: local
  database_data:
    driver: local
  # Volumes pour Caddy (certificats SSL et configuration)
  caddy_data:
  caddy_config:

networks:
  pictorecette-network:
    driver: bridge
